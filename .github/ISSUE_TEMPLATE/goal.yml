name: Goal
description: Capture business/product goal and sub-goals
title: "G-<NNN>: <goal statement>"
labels: ["type:goal", "status:proposed"]
body:
  - type: input
    id: goal-id
    attributes:
      label: ID
  - type: textarea
    id: goal-statement
    attributes:
      label: Goal Statement
  - type: textarea
    id: success-criteria
    attributes:
      label: Success Criteria / KPIs
  - type: textarea
    id: related-requirements
    attributes:
      label: Related Requirements
      description: "Issues that operationalize this goal"
