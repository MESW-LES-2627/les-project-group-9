name: Task
description: Implementation or analysis task. Link it to its user story as a sub-issue.
title: "TASK-<NNN>: <actionable verb + object>"
labels: ["type:task", "status:ready"]
body:
  - type: input
    id: task-id
    attributes:
      label: ID
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What needs to be done and how to tell it is finished"
    validations:
      required: true
