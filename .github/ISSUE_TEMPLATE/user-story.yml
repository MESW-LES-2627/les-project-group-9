name: User Story
description: Feature request or functional capability described from an end-user perspective
title: "US-<NNN>: As a <role>, I want <goal>, so that <benefit>"
labels: ["type:user-story"]
body:
  - type: input
    id: story-id
    attributes:
      label: ID
      description: "Tracking identifier (e.g., US-073)"
      placeholder: "US-<NNN>"
    validations:
      required: true
  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: "State the story in standard format"
      placeholder: |
        **As a** [user role],
        **I want** [action/feature],
        **So that** [value/benefit].
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: "Conditions that must be met for this story to be accepted (e.g., Given/When/Then)"
      placeholder: |
        - [ ] Given ... then ...
        - [ ] Given ... then ...
    validations:
      required: true
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of Done
      description: "Technical and quality criteria required before closing"
      value: |
        - [ ] Unit & integration tests written and passing
        - [ ] End-to-End tests written and passing
        - [ ] Documentation updated
        - [ ] Code reviewed by at least one member and merged
        - [ ] Feature deployed to stating and verified
        - [ ] Ready for production deployment
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: "Trace to epics, parent issues, or specs."
      placeholder: |
        - Epic: #<N> (E<N>. <epic name>)
        - Part of #<N>
        - Satisfies REQ-SYS-<NNN>
    validations:
      required: true
