name: Bug Report
description: Log an internal defect discovered during development or QA to be tracked and corrected.
title: "BUG-<NNN>: <short summary of the defect>"
type: Bug
body:
  - type: input
    id: bug-id
    attributes:
      label: ID
      description: "Tracking identifier (e.g., BUG-009)"
      placeholder: "BUG-<NNN>"
    validations:
      required: true
  - type: textarea
    id: linked-user-story
    attributes:
      label: Linked User Story / Feature
      description: "Link the user story or feature where the defect was found, and reference the relevant code (e.g., #63 — US-042. Reference: `app/routes/account.orders.$id.tsx:93-100`)."
      placeholder: "#<issue> — <US-NNN: title>. Reference: `<path/to/file>:<lines>`."
    validations:
      required: true
  - type: textarea
    id: description-impact
    attributes:
      label: Description & Impact
      description: "What is broken, where it happens, and the impact on users or the system."
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: "Steps that consistently trigger the bug."
      placeholder: |
        1. Sign in and open ...
        2. Compare ...
        3. Inspect ...
    validations:
      required: true
  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Expected vs. Actual Behavior
      description: "State what should happen and what actually happens."
      placeholder: |
        **Expected:** ...

        **Actual:** ...
    validations:
      required: true
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of Done
      description: "Conditions that must be met for the bug to be considered resolved."
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
