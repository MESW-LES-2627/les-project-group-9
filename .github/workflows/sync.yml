name: Sync All Branches to Personal Repo

on:
  push:
    branches:
      - '**'
  create:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Secret
        env:
          PERSONAL_PAT: ${{ secrets.PERSONAL_PAT }}
        run: |
          if [ -z "$PERSONAL_PAT" ]; then
            echo "ERRO: O Secret PERSONAL_PAT está VAZIO ou não foi encontrado!"
            exit 1
          else
            echo "O Secret PERSONAL_PAT foi carregado com sucesso."
          fi
      - name: Push all branches to destination
        env:
          PERSONAL_PAT: ${{ secrets.PERSONAL_PAT }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # Remove remote se já existir de execuções anteriores
          git remote remove personal 2>/dev/null || true
          
          # Adiciona o remote com o token embutido na URL
          git remote add personal https://x-access-token:${PERSONAL_PAT}@github.com/FEUP-tiago-repositories/lesw.git
          
          # Garante o fetch de todas as branches
          git fetch origin --prune
          
          # Executa o push de todas as branches
          git push personal '+refs/remotes/origin/*:refs/heads/*' --force