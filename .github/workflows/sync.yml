name: Sync All Branches to Personal Repo

on:
  push:
    branches:
      - '**'
  create:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push all branches to destination
        env:
          PERSONAL_PAT: ${{ secrets.PERSONAL_PAT }}
          GH_USERNAME: 'FEUP-tiago-repositories'
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # Remove o remote se já existir
          git remote remove personal 2>/dev/null || true
          
          # Passa USERNAME:TOKEN na URL para não solicitar credenciais interativamente
          git remote add personal https://${GH_USERNAME}:${PERSONAL_PAT}@github.com/FEUP-tiago-repositories/lesw.git
          
          # Garante que temos todas as branches locais e remotas atualizadas
          git fetch origin --prune
          
          # Executa o push forçado de todas as branches
          git push personal '+refs/remotes/origin/*:refs/heads/*' --force