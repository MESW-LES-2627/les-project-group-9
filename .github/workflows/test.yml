name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env
        env:
          STOREFRONT_DOMAIN: ${{ secrets.STOREFRONT_DOMAIN }}
          STOREFRONT_API_TOKEN: ${{ secrets.STOREFRONT_API_TOKEN }}
        run: |
          if [ -z "$STOREFRONT_DOMAIN" ] || [ -z "$STOREFRONT_API_TOKEN" ]; then
            echo "::error::Add the STOREFRONT_DOMAIN and STOREFRONT_API_TOKEN repository secrets."
            exit 1
          fi
          echo "SESSION_SECRET=ci-test-secret" > .env
          echo "PUBLIC_STORE_DOMAIN=$STOREFRONT_DOMAIN" >> .env
          echo "PUBLIC_STOREFRONT_API_TOKEN=$STOREFRONT_API_TOKEN" >> .env

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
